# Portfolio index cards. Array order = display order, two cards per row.
# Each `preview` block mirrors the one in _data/galleries/<directory>.yml.
# Prefer a landscape preview: the two cards in a row sit side by side, so a
# portrait thumbnail makes one card much taller than its neighbour.
-
  title: Camargue
  directory: camargue
  picture_path: camargue
  preview:
    filename: DSC1728
    sizes:
    - DSC1728-1000x668.jpg
    thumbnail: DSC1728-thumbnail.jpg
-
  title: Arbres
  directory: arbres
  picture_path: arbres
  preview:
    filename: DSC1317-3
    sizes:
    - DSC1317-3-1000x668.jpg
    thumbnail: DSC1317-3-thumbnail.jpg
